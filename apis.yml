name: Puppet
description: >-
  Puppet (Perforce Puppet, formerly Puppet Labs) is an infrastructure automation and
  configuration-management platform used by more than 40,000 organizations to manage servers,
  networks, cloud, and edge infrastructure through desired-state, policy-driven automation. Its
  products include Puppet Enterprise, Puppet Core, the Bolt orchestration tool, and the Puppet
  Forge module registry. The public Puppet Forge v3 API provides RESTful access to the modules,
  releases, users, and release plans published on Forge; Puppet Enterprise additionally exposes
  REST APIs for orchestration, node classification, RBAC, and PuppetDB querying. Puppet was
  acquired by Perforce Software in 2022.
